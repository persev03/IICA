services:
  - type: web
    name: iica-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/persev03/IICA
    branch: main
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: IICA_ALLOWED_ORIGINS
        value: https://persev03.github.io,https://iica-admin.onrender.com
      - key: SUPABASE_URL
        value: https://wvadbakdrbhbtihhkpjl.supabase.co
      - key: SUPABASE_ADMIN_EMAILS
        sync: false
      - key: IICA_ADMIN_API_KEY
        generateValue: true
      - key: IICA_GEOCODER_URL
        value: https://nominatim.openstreetmap.org/search
      - key: IICA_GEOCODER_USER_AGENT
        value: IICA/0.1 (https://github.com/persev03/IICA)
      - key: IICA_OLLAMA_MODEL
        value: qwen2.5:7b-instruct
      - key: IICA_OLLAMA_CHAT_URL
        sync: false
      - key: IICA_OLLAMA_TIMEOUT_SECONDS
        value: "25"
      - key: IICA_OLLAMA_TEMPERATURE
        value: "0.2"
      - key: IICA_HF_API_KEY
        sync: false
      - key: IICA_HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct

  - type: web
    name: iica-admin
    runtime: static
    repo: https://github.com/persev03/IICA
    branch: main
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @iica/admin build
    staticPublishPath: ./apps/admin/out
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_IICA_API_URL
        value: https://iica-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://wvadbakdrbhbtihhkpjl.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Go3mF9k9BKMZ5cPjey1AHA_LOJKIxKE
